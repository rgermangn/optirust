<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ThinFlux Benchmark Lab</title>
    <style>
        :root {
            --rust: #f74c00;
            --bg: #121212;
            --card: #1e1e1e;
            --text: #e0e0e0;
            --success: #2ecc71;
        }
        body { 
            font-family: 'Inter', system-ui, sans-serif; 
            background: var(--bg); 
            color: var(--text); 
            line-height: 1.6;
            margin: 0; padding: 40px 20px;
        }
        .header { text-align: center; max-width: 800px; margin: 0 auto 50px; }
        h1 { color: var(--rust); font-size: 2.5rem; margin-bottom: 10px; }
        code { background: #333; padding: 2px 6px; border-radius: 4px; font-family: monospace; }
        
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 25px;
            max-width: 1200px;
            margin: 0 auto;
        }
        .card {
            background: var(--card);
            border-radius: 12px;
            border: 1px solid #333;
            overflow: hidden;
            transition: transform 0.3s ease;
        }
        .card:hover { transform: translateY(-8px); border-color: var(--rust); }
        .img-container {
            height: 200px;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        img { max-width: 100%; max-height: 100%; object-fit: contain; }
        
        .stats { padding: 20px; }
        .filename { font-weight: 700; color: #888; margin-bottom: 10px; display: block; }
        .size-compare { display: flex; flex-direction: column; gap: 5px; }
        .old-size { font-size: 0.85rem; color: #666; text-decoration: line-through; }
        .new-size { font-size: 1.2rem; font-weight: bold; color: var(--rust); }
        .saving { 
            font-size: 0.9rem; 
            color: var(--success); 
            background: rgba(46, 204, 113, 0.1);
            padding: 4px 8px;
            border-radius: 4px;
            align-self: flex-start;
        }
    </style>
</head>
<body>

<div class="header">
    <h1>ThinFlux Benchmark</h1>
    <p>Compare o peso das imagens antes e depois da otimização pelo CI/CD.</p>
    <p><small>Se os valores forem iguais, faça um commit em <code>/demo</code> para disparar o <code>thinflux</code> no GitHub Actions!</small></p>
</div>

<div class="grid" id="gallery"></div>

<script>
    const originalAssets = {
        "00.png": 2471.28, "01.png": 2496.07, "02.png": 1069.50, "03.png": 517.30,
        "04.png": 2767.60, "05.png": 1160.96, "06.png": 911.54,  "07.png": 1041.48,
        "08.png": 871.55,  "09.png": 1315.48, "10.png": 400.23,  "11.png": 2197.83,
        "12.png": 423.23,  "13.png": 570.84,  "14.png": 1775.06, "15.png": 367.48,
        "16.png": 797.13,  "17.png": 775.60,  "18.png": 776.87,  "19.png": 1547.87
    };

    const gallery = document.getElementById('gallery');

    Object.keys(originalAssets).forEach((name, index) => {
        const path = `assets/${name}`;
        const originalSize = originalAssets[name];

        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
            <div class="img-container">
                <img src="${path}" alt="${name}">
            </div>
            <div class="stats">
                <span class="filename">${name}</span>
                <div class="size-compare" id="compare-${index}">
                    <span class="new-size">Calculando...</span>
                </div>
            </div>
        `;
        gallery.appendChild(card);

        updateSize(path, index, originalSize);
    });

    async function updateSize(path, index, originalSize) {
        try {
            const response = await fetch(path, { cache: "no-store" });
            const blob = await response.blob();
            const currentSizeKB = (blob.size / 1024).toFixed(2);
            
            const diff = (originalSize - currentSizeKB).toFixed(2);
            const percent = ((diff / originalSize) * 100).toFixed(1);
            const container = document.getElementById(`compare-${index}`);

            if (diff > 1.0) { 
                container.innerHTML = `
                    <span class="old-size">Original: ${originalSize.toFixed(2)} KB</span>
                    <span class="new-size">Atual: ${currentSizeKB} KB</span>
                    <span class="saving">↓ ${percent}% de redução</span>
                `;
            } else {
                container.innerHTML = `
                    <span class="new-size">${currentSizeKB} KB</span>
                    <span class="filename" style="font-size:0.7rem">Aguardando otimização...</span>
                `;
            }
        } catch (e) {
            document.getElementById(`compare-${index}`).innerText = "Erro no asset";
        }
    }
</script>

</body>
</html>
