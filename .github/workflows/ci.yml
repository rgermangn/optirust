name: ThinFlux CI/CD Pipeline

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  audit-and-test:
    name: 🛡️ Security, Lint & Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain
        uses: actions/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      # PASSO 3: Exame de Segurança Cibernética (Supply Chain)
      - name: 🔎 RustSec Cargo Audit
        uses: rustsec/audit-check-action@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # PASSO 5 (Exame extra): Verificar formatação e boas práticas de código
      - name: ⚙️ Check Formatting
        run: cargo fmt --check

      - name: 🪛 Lint with Clippy
        run: cargo clippy -- -D warnings

      # PASSO 4: Build e Testes em modo Release
      - name: 🧪 Run Tests
        run: cargo test --release

      - name: 🏗️ Build Production Binary
        run: cargo build --release

  build-and-push-docker:
    name: 🐳 Docker Build & Publish
    needs: audit-and-test
    # Só faz o push para o DockerHub se o gatilho for um push na branch main (evita rodar em PRs de forks)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Extrai a versão automaticamente do Cargo.toml para taguear o Docker
      - name: Extract Version from Cargo.toml
        id: get_version
        run: |
          VERSION=$(grep '^version' Cargo.toml | head -1 | awk -F '"' '{print $2}')
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # PASSO 7 (Preparação): Autenticar no DockerHub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # PASSO 6: Docker Build
      - name: 🏗️ Build and Load Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          tags: |
            betoxvt/thinflux:latest
            betoxvt/thinflux:${{ steps.get_version.outputs.VERSION }}

      # PASSO 5 (Exame extra do Container): Escanear vulnerabilidades na imagem final
      - name: 🛡️ Scan Docker image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "betoxvt/thinflux:latest"
          format: "table"
          exit-code: "1" # Falha o pipeline se achar algo crítico
          ignore-unfixed: true
          vuln-type: "os,library"
          severity: "CRITICAL,HIGH"

      # PASSO 7: Enviar para o Registro se passar no scan
      - name: 🚀 Push Docker Image to DockerHub
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            betoxvt/thinflux:latest
            betoxvt/thinflux:${{ steps.get_version.outputs.VERSION }}
