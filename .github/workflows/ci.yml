name: ThinFlux CI/CD Pipeline

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  audit-and-test:
    name: 🛡️ Security, Lint & Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: clippy, rustfmt

      - name: 🔎 RustSec Cargo Audit
        uses: actions-rust-lang/audit@v1

      - name: ⚙️ Check Formatting
        uses: actions-rust-lang/rustfmt@v1

      - name: 🪛 Lint with Clippy
        run: cargo clippy -- -D warnings

      - name: 🧪 Run Tests
        run: cargo test --release

      - name: 🏗️ Build Production Binary
        run: cargo build --release

      - name: 📦 Upload Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: thinflux-linux-x86_64
          path: target/release/thinflux

  build-and-push-docker:
    name: 🐳 Docker Build & Publish
    needs: audit-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Extract Version from Cargo.toml
        id: get_version
        run: |
          VERSION=$(grep '^version' Cargo.toml | head -1 | awk -F '"' '{print $2}')
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 🏗️ Build and Load Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          tags: |
            betoxvt/thinflux:latest
            betoxvt/thinflux:${{ steps.get_version.outputs.VERSION }}

      - name: 🛡️ Scan Docker image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "betoxvt/thinflux:latest"
          format: "table"
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: "os,library"
          severity: "CRITICAL,HIGH"

      - name: 🚀 Push Docker Image to DockerHub
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            betoxvt/thinflux:latest
            betoxvt/thinflux:${{ steps.get_version.outputs.VERSION }}
