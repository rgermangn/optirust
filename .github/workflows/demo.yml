name: 🧪 ThinFlux Demo Lab

on:
  workflow_run:
    workflows: ["ThinFlux CI/CD Pipeline"]
    types:
      - completed
  push:
    branches:
      - main
    paths:
      - "demo/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy-demo:
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'push' || github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: 🐳 Run ThinFlux (Optimization Step)
        run: |
          docker run --rm \
            -v ${{ github.workspace }}/demo/assets:/data \
            -v ${{ github.workspace }}:/app \
            -w /app \
            betoxvt/thinflux:latest run /data --summary

      - name: 🛠️ Setup Pages
        uses: actions/configure-pages@v5

      - name: 📦 Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './demo'

      - name: 🚀 Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
