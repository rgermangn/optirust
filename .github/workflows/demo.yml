name: 🧪 ThinFlux Demo Lab

on:
  workflow_run:
    workflows: ["ThinFlux CI/CD Pipeline"]
    types:
      - completed
  push:
    branches:
      - main
    paths:
      - "demo/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-demo:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'push' || github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: 🐳 Run ThinFlux (Optimization Step)
        run: |
          docker run --rm \
            -v ${{ github.workspace }}/demo/assets:/data \
            -v ${{ github.workspace }}:/app \
            -w /app \
            betoxvt/thinflux:latest run /data --summary

      - name: 🌐 Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./demo
